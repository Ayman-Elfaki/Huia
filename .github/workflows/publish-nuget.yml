name: Publish NuGet packages

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve package version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore
        run: dotnet restore Huia.slnx

      - name: Build
        run: dotnet build Huia.slnx -c Release --no-restore -p:Version=${{ steps.version.outputs.value }}

      - name: Create artifacts directory
        run: mkdir -p ${{ github.workspace }}/artifacts

      - name: Pack Huia
        run: >
          dotnet pack src/Huia/Huia.csproj -c Release --no-build
          -p:Version=${{ steps.version.outputs.value }}
          -o ${{ github.workspace }}/artifacts

      - name: Pack Huia.EntityFrameworkCore
        run: >
          dotnet pack src/Huia.EntityFrameworkCore/Huia.EntityFrameworkCore.csproj -c Release --no-build
          -p:Version=${{ steps.version.outputs.value }}
          -o ${{ github.workspace }}/artifacts

      - name: Push to NuGet.org
        if: github.ref_type == 'tag'
        run: >
          dotnet nuget push ${{ github.workspace }}/artifacts/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ${{ github.workspace }}/artifacts/*.nupkg