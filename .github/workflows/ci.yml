name: ci

on:
  pull_request:
  workflow_dispatch: {}

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  CI: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/dotnet
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet build Huia.slnx -c Release
      - run: dotnet test Huia.slnx -c Release --no-build --filter "Category!=Container&Category!=E2E&Category!=PenTest"

  pen-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/dotnet
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet test tests/Huia.Tests.PenTest/Huia.Tests.PenTest.csproj -c Release --filter "Category=PenTest"

  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/dotnet
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet test tests/Huia.IntegrationTests/Huia.IntegrationTests.csproj -c Release --filter "Category=Container"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Release build of every sample the front-end E2E fixture launches out-of-process.
      - working-directory: src/dotnet
        run: dotnet build Huia.slnx -c Release
      # `npm run build` both Nuxt front-ends so `.output/server/index.mjs` exists for the fixture.
      # (each app's .npmrc pins legacy-peer-deps — an npm 10 arborist crash on the nuxt peer graph)
      - working-directory: samples/Todo/Todo.Nuxt
        run: npm ci && npm run build
      - working-directory: samples/Todo/Todo.Admin
        run: npm ci && npm run build
      # Build the nuxt-huia-oidc playground .output for HuiaNuxtPlaygroundFixture.
      - working-directory: src/nuxt/nuxt-huia-oidc
        run: npm ci && npm run dev:build
      # Build Shop.Nuxt's .output for ShopStackFixture.
      - working-directory: samples/Shop/Shop.Nuxt
        run: npm ci && npm run build
      # Build Todo.Next and Shop.Next production outputs for NextFrontEndFixture.
      - name: Build Shared Core & Next.js libraries
        run: |
          npm --prefix src/shared/huia-auth-core install
          npm --prefix src/shared/huia-auth-core run build
          npm --prefix src/next/next-huia-oidc install
          npm --prefix src/next/next-huia-oidc run build
          npm --prefix src/next/next-huia-headless install
          npm --prefix src/next/next-huia-headless run build
      - working-directory: samples/Todo/Todo.Next
        run: npm install && npm run build
      - working-directory: samples/Shop/Shop.Next
        run: npm install && npm run build
      - run: pwsh tests/Huia.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      # Warm the images the AppHost-backed mail E2E fixture needs (Docker is preinstalled on the runner).
      - run: docker pull axllent/mailpit:v1.21 || true
      - run: dotnet test tests/Huia.E2ETests/Huia.E2ETests.csproj -c Release --no-build --filter "Category=E2E"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - working-directory: docs
        run: npm install && npm run docs:build

  web-assets:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/dotnet
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The BuildAccountUiAssets MSBuild target regenerates wwwroot/; -p:ForceAccountUiAssets=true
      # bypasses its incremental check so the drift guard always compares a fresh build.
      - run: dotnet build src/Huia.OpenId/Huia.OpenId.csproj -c Release -p:ForceAccountUiAssets=true
      - run: git diff --exit-code src/Huia.OpenId/wwwroot

  huia-auth-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/shared/huia-auth-core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build

  next-huia-oidc:
    runs-on: ubuntu-latest
    needs: huia-auth-core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm --prefix src/shared/huia-auth-core install && npm --prefix src/shared/huia-auth-core run build
      - working-directory: src/next/next-huia-oidc
        run: |
          npm install
          npm test
          npm run build

  next-huia-headless:
    runs-on: ubuntu-latest
    needs: huia-auth-core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm --prefix src/shared/huia-auth-core install && npm --prefix src/shared/huia-auth-core run build
      - working-directory: src/next/next-huia-headless
        run: |
          npm install
          npm test
          npm run build

  nuxt-module:
    runs-on: ubuntu-latest
    needs: huia-auth-core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm --prefix src/shared/huia-auth-core install && npm --prefix src/shared/huia-auth-core run build
      - working-directory: src/nuxt/nuxt-huia-oidc
        run: |
          npm install
          npm run dev:prepare
          npm run test:types
          npm test
          npm run dev:build

  nuxt-huia-headless-module:
    runs-on: ubuntu-latest
    needs: huia-auth-core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm --prefix src/shared/huia-auth-core install && npm --prefix src/shared/huia-auth-core run build
      - working-directory: src/nuxt/nuxt-huia-headless
        run: |
          npm install
          npm run dev:prepare
          npm run test:types
          npm test
          npm run dev:build
