name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      target:
        description: 'Release target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - dotnet
          - npm
      version:
        description: 'Explicit version to release (e.g. 1.0.0-alpha.16). Leave blank on a tag build to let MinVer / tag derive it.'
        required: false

permissions:
  contents: write

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  CI: 'true'

jobs:
  publish-dotnet:
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'dotnet'
    runs-on: ubuntu-latest
    environment: nuget
    defaults:
      run:
        working-directory: src/dotnet
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # MinVer needs the full history and tags to derive the version
          fetch-tags: true
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Huia.slnx -c Release

      - name: Test
        run: dotnet test Huia.slnx -c Release --no-build --filter "Category!=Container&Category!=E2E&Category!=Aspire"

      - name: Pack
        run: |
          version_arg=""
          if [ -n "${{ inputs.version }}" ]; then
            version_arg="-p:Version=${{ inputs.version }}"
          fi
          for proj in \
            src/Huia/Huia.csproj \
            src/Huia.OpenId.EntityFrameworkCore/Huia.OpenId.EntityFrameworkCore.csproj \
            src/Huia.OpenId/Huia.OpenId.csproj \
            src/Huia.Headless.EntityFrameworkCore/Huia.Headless.EntityFrameworkCore.csproj \
            src/Huia.Headless/Huia.Headless.csproj
          do
            dotnet pack "$proj" -c Release -o artifacts $version_arg
          done
          ls -l artifacts

      - name: Push to NuGet.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            src/dotnet/artifacts/*.nupkg
            src/dotnet/artifacts/*.snupkg

  publish-npm:
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'npm'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Determine release version
        id: meta
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            ref="${{ github.ref_name }}"
            version="${ref#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify package versions match release tag
        run: |
          expected="${{ steps.meta.outputs.version }}"
          for pkg in \
            src/javascript/shared/huia-auth-core \
            src/javascript/next/next-huia-oidc \
            src/javascript/next/next-huia-headless \
            src/javascript/nuxt/nuxt-huia-oidc \
            src/javascript/nuxt/nuxt-huia-headless
          do
            v=$(node -p "require('./$pkg/package.json').version")
            if [ "$v" != "$expected" ]; then
              echo "::error::Package $pkg has version $v, expected $expected. Update package.json to match."
              exit 1
            fi
          done

      - name: Publish huia-auth-core
        working-directory: src/javascript/shared/huia-auth-core
        run: |
          npm ci
          npm test
          npm run build
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Next.js packages
        run: |
          for pkg in next-huia-oidc next-huia-headless; do
            echo "Publishing $pkg..."
            cd "src/javascript/next/$pkg"
            npm ci
            npm test
            npm run build
            npm publish --access public
            cd - >/dev/null
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Nuxt packages
        run: |
          for pkg in nuxt-huia-oidc nuxt-huia-headless; do
            echo "Publishing $pkg..."
            cd "src/javascript/nuxt/$pkg"
            npm ci
            npm test
            npm run build
            npm publish --access public
            cd - >/dev/null
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    needs: [publish-dotnet, publish-npm]
    if: always() && startsWith(github.ref, 'refs/tags/v') && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        if: needs.publish-dotnet.result == 'success'
        continue-on-error: true
        with:
          name: packages
          path: artifacts
      - name: Create GitHub release
        run: |
          if ls artifacts/*.nupkg 1> /dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" artifacts/*.nupkg --generate-notes
          else
            gh release create "${{ github.ref_name }}" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
